<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <title>Test Sayfasi</title>
</head>
<body style="font-family:sans-serif; padding:20px;">
    
    <header style="display:flex; justify-content:space-between; align-items:center;">
        <h1 id="baslik">Kitap Defterim</h1>
        <select id="dilSecimi" style="padding:8px;">
            <option value="tr">Türkçe</option>
            <option value="en">English</option>
            <option value="de">Deutsch</option>
        </select>
    </header>

    <p id="aciklama">Bu bir test sayfasıdır.</p>

    <script>
        // Sözlük
        const sozluk = {
            tr: { baslik: "Kitap Defterim", aciklama: "Bu bir test sayfasıdır." },
            en: { baslik: "My Book Diary", aciklama: "This is a test page." },
            de: { baslik: "Mein Buch", aciklama: "Dies ist eine Testseite." }
        };

        const secici = document.getElementById('dilSecimi');
        const baslik = document.getElementById('baslik');
        const aciklama = document.getElementById('aciklama');

        secici.onchange = function(e) {
            const secilenDil = e.target.value;
            console.log("Seçilen dil:", secilenDil); // F12 konsolunda göreceğiz
            
            // Yazıları değiştir
            baslik.textContent = sozluk[secilenDil].baslik;
            aciklama.textContent = sozluk[secilenDil].aciklama;
        };
    </script>
</body>
</html>
